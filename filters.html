/* ---------- рушій: залишки й середня собівартість ---------- */
function engine(upTo){
  const Q={},V={};const cogs={};const lc={};const errs=[];
  const avg=i=>Q[i]>1e-9?V[i]/Q[i]:stdCost(i,{Q,V});
  const add=(i,q,v)=>{Q[i]=(Q[i]||0)+q;V[i]=(V[i]||0)+v};
  const take=(i,q)=>{const c=avg(i)*q;add(i,-q,-c);if(Q[i]<-1e-6)errs.push(i);if(Math.abs(Q[i])<1e-9){Q[i]=0;V[i]=0}return c};
  for(const m of moves()){ if(upTo&&m.date>upTo)break;
    let c=0;
    if(m.type==='buy'||m.type==='contrib'){for(const l of m.lines||[])add(l.i,+l.q,+l.q*(+l.p||0))}
    else if(m.type==='prod'){
      let used=0;for(const u of m.use||[])used+=take(u.i,+u.q);
      const outs=(m.lines||[]).map(l=>({...l,std:bomCost(l.i,{Q,V})*l.q}));const tot=outs.reduce((a,o)=>a+o.std,0)||1;
      for(const o of outs)add(o.i,+o.q,used*o.std/tot);
      c=used;
    }
    else if(m.type==='sale'||m.type==='take'){lc[m.id]=[];for(const l of m.lines||[]){const x=take(l.i,+l.q);lc[m.id].push(x);c+=x}}
    else if(m.type==='adj'){for(const l of m.lines||[]){if(+l.q<0)c+=take(l.i,-l.q);else{const v=+l.q*avg(l.i);add(l.i,+l.q,v);c-=v}}}
    cogs[m.id]=c;
  }
  return {Q,V,cogs,lc,errs,avg};
}
function lastBuyPrice(i){let p=null;for(const m of moves())if((m.type==='buy'||m.type==='contrib'))for(const l of m.lines||[])if(l.i===i&&+l.p>0)p=+l.p;return p}
function stdCost(i,st){const it=S.f_items[i]||{};if(it.kind==='prod')return bomCost(i,st);const lb=lastBuyPrice(i);return lb!=null?lb:(+it.std||0)}
function bomCost(i,st){const it=S.f_items[i]||{};let c=0;for(const b of it.bom||[]){const q=st&&st.Q[b.i]>1e-9?st.V[b.i]/st.Q[b.i]:stdCost(b.i);c+=b.q*q}return c}
function curCost(i){const E=engine();const it=S.f_items[i]||{};if(it.kind==='prod')return bomCost(i,E);return E.Q[i]>1e-9?E.V[i]/E.Q[i]:stdCost(i)}
function tierPrice(i,t){const it=S.f_items[i]||{};const z=curCost(i);if(t==='Z')return z;if(t==='D')return it.D!=null?+it.D:z+(+it.mk||0);return +it[t]||0}
const mvTotal=m=>m.total!=null&&m.total!==''?+m.total:(m.lines||[]).reduce((a,l)=>a+(+l.q)*(+l.p||0),0);

function partBook(E,upTo){const B={};for(const k of PARTNERS)B[k]={init:0,mat:0,eq:0,exp:0,cash:0,sold:0,took:0,paid:0};
  for(const m of moves()){if(upTo&&m.date.slice(0,7)>upTo)continue;const k=bookKey(m,E);if(k&&B[k.p])B[k.p][k.c]+=k.v}
  return B}
function bookKey(m,E){const t=mvTotal(m);
  if(m.init){const p=m.payer||m.partner;if(['buy','contrib','eq','exp'].includes(m.type)||(m.type==='cash'&&m.dir==='in'))return {p,c:'init',v:t}}
  if(m.type==='buy')return {p:m.payer,c:'mat',v:t};if(m.type==='contrib')return {p:m.partner,c:'mat',v:t};
  if(m.type==='eq')return {p:m.payer,c:'eq',v:t};if(m.type==='exp')return {p:m.payer,c:'exp',v:t};
  if(m.type==='cash')return {p:m.partner,c:m.dir==='in'?'cash':'paid',v:t};
  if(m.type==='sale')return {p:m.recv||'Даниїл',c:'sold',v:t};
  if(m.type==='take')return {p:m.partner,c:'took',v:m.total!=null&&m.total!==''?+m.total:(E.cogs[m.id]||0)};return null}
const tap=(v,act,id,cls='')=>`<button type="button" class="tapn ${cls}" data-act="${act}" data-id="${esc(id)}">${v}</button>`;
function receipt(E,mon){const r=plMonth(E,mon);
  const row=(l,v,k,cls='')=>`<div class="ln2 ${cls}"><span>${l}</span><b>${k?tap(v,'brk',k+'|'+mon,cls.includes('neg')?'neg':''):v}</b></div>`;
  return `<div class="rcpt">${row('Дохід (продажі)',f0(r.rev),'rev')}${row('Витрати періоду',f0(r.cogs+r.exp+r.adj),'')}
   ${row('· собівартість проданого товару',f0(r.cogs),'cogs','mut sb2')}${row('· оренда, доставка та інше',f0(r.exp+r.adj),'exp','mut sb2')}
   ${row('Прибуток',f0(r.res),'res','tot'+(r.res<0?' neg':''))}</div>`}
function invest(E,upTo){/* upTo = 'YYYY-MM' or null */
  const inM=m=>!upTo||m.date.slice(0,7)<=upTo;
  const P={};for(const k of PARTNERS)P[k]={init:0,after:0};
  const C={mat:0,eq:0,exp:0,cash:0};let took=0,paid=0,cash=0;const hold={};
  for(const m of moves()){if(!inM(m))continue;const t=mvTotal(m);
    const who=m.payer||m.partner;
    const contrib=(['buy','eq','exp'].includes(m.type)&&PARTNERS.includes(m.payer))||m.type==='contrib'||(m.type==='cash'&&m.dir==='in');
    if(contrib){P[who][m.init?'init':'after']+=t;C[m.type==='buy'||m.type==='contrib'?'mat':m.type==='eq'?'eq':m.type==='exp'?'exp':'cash']+=t}
    if(m.type==='sale'){const r=m.recv||'Даниїл';hold[r]=(hold[r]||0)+t;cash+=t}
    if(m.type==='take'){const v=(m.total!=null&&m.total!==''?+m.total:(E.cogs[m.id]||0));took+=v;if(P[m.partner])P[m.partner].took=(P[m.partner].took||0)+v}
    if(m.type==='cash'&&m.dir==='out'&&P[m.partner])P[m.partner].paid=(P[m.partner].paid||0)+t;
    if(m.type==='cash'&&m.dir==='out'){paid+=t;hold[m.partner]=(hold[m.partner]||0)-t;cash-=t}
    if(['buy','eq','exp'].includes(m.type)&&m.payer==='Каса проекту'){cash-=t;hold['Каса проекту']=(hold['Каса проекту']||0)-t}}
  const EE=upTo?engine(upTo+'-31'):E;const st=Object.values(EE.V).reduce((a,v)=>a+v,0);
  const eq=moves().filter(m=>m.type==='eq'&&inM(m)).reduce((a,m)=>a+(+m.total||0),0);
  let cum=0;for(const mo of allMons())if(!upTo||mo<=upTo)cum+=plMonth(E,mo).res;
  const inv=PARTNERS.reduce((a,k)=>a+P[k].init+P[k].after,0);
  let soldC=0,tookC=0,adjC=0;for(const m of moves()){if(!inM(m))continue;const c=E.cogs[m.id]||0;if(m.type==='sale')soldC+=c;else if(m.type==='take')tookC+=c;else if(m.type==='adj')adjC+=c}
  return {P,C,took,paid,cash,hold,st,eq,cum,inv,bal:st+eq+cash,soldC,tookC,adjC}}
function partnerBal(E,upTo){const x=invest(E,upTo);const u=upTo||'';const L=['Даниїл','Анатолій'];
  const v=k=>{const p=x.P[k];const inn=p.init+p.after,tk=(p.took||0)+(p.paid||0),sh=0,own=inn-tk,hold=x.hold[k]||0;return {inn,tk,sh,own,hold,net:own-hold}};
  const V=Object.fromEntries(L.map(k=>[k,v(k)]));
  const tr=(l,f,cls='')=>`<tr class="${cls}"><td>${l}</td>${L.map(k=>`<td class="num">${f(V[k],k)}</td>`).join('')}</tr>`;
  return `<section class="card"><h2>Партнери${upTo?' · на кінець '+mLabel(upTo).toLowerCase():''}</h2><div class="tbl"><table class="pl ut pb"><thead><tr><th></th>${L.map(k=>`<th class="num">${k}</th>`).join('')}</tr></thead><tbody>
   ${tr('Вклав',(a,k)=>tap(f0(a.inn),'brk','inv:all:'+k+'|'+u))}
   ${tr('− Забрав',(a,k)=>a.tk?tap(f0(a.tk),'brk','inv:tookp:'+k+'|'+u):'0')}
   ${tr('<b>= Вкладення</b>',a=>`<b>${f0(a.own)}</b>`,'sum')}
   ${tr('− Гроші проекту на руках',(a,k)=>a.hold?tap(f0(a.hold),'brk','rev:all|'+u):'0')}
   </tbody><tfoot><tr class="final"><td>Залишок</td>${L.map(k=>`<td class="num">${f0(V[k].net)}</td>`).join('')}</tr></tfoot></table></div>
   <div class="ln2 tot" style="margin-top:10px"><span>Результат проекту з початку<div class="note">поки не розподілено між партнерами</div></span><b class="${x.cum<0?'neg':''}">${tap(f0(x.cum),'brk','p:pl:x|'+u,x.cum<0?'neg':'')}</b></div>
   <p class="note">Залишок — вкладення партнера мінус гроші проекту, що лежать у нього.</p></section>`}
function partnersCard(E,upTo){const x=invest(E,upTo);const u=upTo||'';const L=['Даниїл','Анатолій'];
  const V=Object.fromEntries(L.map(k=>{const p=x.P[k];const inn=p.init+p.after,tk=(p.took||0)+(p.paid||0);return [k,{init:p.init,after:p.after,inn,tk,own:inn-tk}]}));
  const T=k=>L.reduce((a,n)=>a+V[n][k],0);

  const row=(l,v,k,note='')=>`<div class="ln2"><span>${l}${note?`<div class="note">${note}</div>`:''}</span><b>${k==='stock'?tap(f0(v),'goTab','stock'):k?tap(f0(v),'brk',k+'|'+u):f0(v)}</b></div>`;
  return `<section class="card"><h2>Партнери${upTo?' · на кінець '+mLabel(upTo).toLowerCase():''}</h2><div class="tbl"><table class="pl ut pb"><thead><tr><th></th>${L.map(k=>`<th class="num">${k}</th>`).join('')}<th class="num tcol">Разом</th></tr></thead><tbody>
   ${tr('Старт','init',(v,n)=>n?tap(f0(v),'brk','p:init:'+n+'|'+u):f0(v))}
   ${tr('Після запуску','after',(v,n)=>n?tap(f0(v),'brk','inv:after:'+n+'|'+u):f0(v))}
   ${tr('<b>Вклав</b>','inn',v=>`<b>${f0(v)}</b>`,'sum')}
   ${tr('− Забрав','tk',(v,n)=>n&&v?tap(f0(v),'brk','inv:tookp:'+n+'|'+u):f0(v))}
   </tbody><tfoot><tr class="final"><td>Вкладення</td>${L.map(n=>`<td class="num">${f0(V[n].own)}</td>`).join('')}<td class="num">${f0(T('own'))}</td></tr></tfoot></table></div>
   <p class="note">Старт ${initLocked?'зафіксовано (вересень закрито)':'ще не зафіксовано — закрийте вересень'}.</p>
   <div class="ln2 tot" style="margin-top:6px"><span style="text-align:left">${x.cum<0?'Збиток':'Прибуток'} з початку<div class="note" style="font-weight:400">поки не розподілено між партнерами</div></span><b>${tap(f0(x.cum),'brk','p:pl:x|'+u,x.cum<0?'neg':'')}</b></div>
   <div class="ln2 tot"><span>Вкладення ${x.cum<0?'− збиток':'+ прибуток'}</span><b>${f0(T('own')+x.cum)}</b></div>
   <div class="lnh" style="margin-top:14px">В чому зараз гроші</div>
   <div class="rcpt">${row('Товар і сировина на складі',x.st,'stock',`із закупленого ${f0(x.C.mat)}: продано ${f0(x.soldC)} · забрали ${f0(x.tookC)}${x.adjC?' · списано '+f0(x.adjC):''}`)}
   ${row('Обладнання',x.eq,'inv:eq')}${row('Гроші від продажів',x.cash,'rev:all',holders)}
   <div class="ln2 tot"><span>Разом</span><b>${f0(x.bal)}</b></div></div>
   </section>`}
function viewHome(){
  const E=engine(), mon=todayISO().slice(0,7), cl=fClosed(mon);
  let h=actBtns();
  h+=`<section class="card"><div class="shead"><h2 style="margin:0">${mLabel(mon)}</h2><span class="stat ${cl?'cl':'op'}">${cl?'закрито':'відкритий'}</span></div>${receipt(E,mon)}
   <button class="btn sm" style="margin-top:10px" data-act="openMon" data-id="${mon}" type="button">Деталі місяця →</button></section>`;
  h+=partnersCard(E,null);
  const low=items().filter(it=>it.kind!=='raw'&&it.min!=null&&(E.Q[it.id]||0)<+it.min);const neg=[...new Set(E.errs)];
  if(neg.length)h+=`<section class="card"><h2 class="neg">Перевірте</h2><p class="note">Продано або списано більше, ніж є: ${neg.map(i=>esc(itemName(i))).join(', ')}.</p></section>`;
  if(low.length)h+=`<section class="card"><h2>Закінчується</h2>${low.map(it=>`<div class="ln2"><span>${esc(it.name)}</span><b>${fq(E.Q[it.id])} ${it.unit}</b></div>`).join('')}</section>`;
  return h;
}

function plMonth(E,mon){const r={rev:0,cogs:0,exp:0,adj:0,n:0};
  for(const m of moves()){if(m.date.slice(0,7)!==mon)continue;
    if(m.type==='sale'){r.rev+=mvTotal(m);r.cogs+=E.cogs[m.id]||0;r.n++}
    else if(m.type==='take'){const c=E.cogs[m.id]||0;r.rev+=m.total!=null&&m.total!==''?+m.total:c;r.cogs+=c}
    else if(m.type==='adj')r.adj+=E.cogs[m.id]||0;
    else if(m.type==='exp')r.exp+=+m.total||0}
  r.res=r.rev-r.cogs-r.exp-r.adj;return r}
function capital(E,upTo){const P={};for(const x of [...PARTNERS,'Каса проекту'])P[x]={inn:0,out:0,pl:0};
  const add=(who,k,v)=>{(P[who]||(P[who]={inn:0,out:0,pl:0}))[k]+=v};
  for(const m of moves()){if(upTo&&m.date.slice(0,7)>upTo)continue;
    if(m.type==='buy'||m.type==='exp'||m.type==='eq')add(m.payer||'Даниїл','inn',mvTotal(m));
    else if(m.type==='contrib')add(m.partner,'inn',mvTotal(m));
    else if(m.type==='cash')add(m.partner,m.dir==='in'?'inn':'out',+m.total||0);
    else if(m.type==='sale')add(m.recv||'Даниїл','out',mvTotal(m));
    else if(m.type==='take')add(m.partner,'out',m.total!=null&&m.total!==''?+m.total:E.cogs[m.id]||0)}
  const mons=[...new Set(moves().map(m=>m.date.slice(0,7)))].filter(x=>!upTo||x<=upTo);
  let cum=0;for(const mo of mons)cum+=plMonth(E,mo).res;
  for(const k of PARTNERS)P[k].pl=cum*SHARE[k];
  const kas=P['Каса проекту'];kas.bal=kas.out-kas.inn;
  for(const k of PARTNERS)P[k].bal=P[k].inn-P[k].out+P[k].pl;
  return {P,cum,mons}}
let partMon=null;function setPartMon(m){partMon=m;render()}
function goTab(t){tab=t;render();window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;if(tab==='months')monOpen=null;render();return}
  const a=e.target.closest('[data-act]');if(!a||!a.dataset.act)return;
  ({addMove,editMove,editItem,itemHist,goTab,setPartMon,setHomeMon,openMon,toggleMon,brk,setMvPart:v=>{mvPart=v||'';render()}})[a.dataset.act]?.(a.dataset.id);
});
document.addEventListener('change',e=>{if(e.target.id==='mvFilter'){mvFilter=e.target.value;render()}if(e.target.id==='partMon'){partMon=e.target.value;render()}if(e.target.id==='homeMon'){homeMon=e.target.value;render()}});

/* ---------- boot ---------- */
(async()=>{
  try{
    db=window.claude&&await window.claude.use('db');
    if(!db){fatal='Немає зв’язку з базою.';render();return}
    const user=await window.claude.use('user');if(user){try{me=await user.id()}catch(_){}}
    const r=window.WL_ROLE||'owner';
    if(r!=='owner'&&r!=='tech'){fatal='Розділ «Фільтри» недоступний для вашого облікового запису.';render();return}
    
    for(const c of COLS){
      db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[c]=o;loaded.add(c);render()},err=>{loaded.add(c);render()});
    }
  }catch(e){fatal='Не вдалося підключитися до бази.';render()}
})();
render();
</script>
