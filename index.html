const COLS=['points','months','pm','exp','settle','meta','util','pay','tariffs','inv','bal','mov','radj','expreq','svc','sales','meter','gwday'];
const ARTS=[
 {g:'Обслуговування мережі',cat:'ТОіР',items:['Сервіс і заміна фільтрів','Фільтри та мембрани','Ремонт і запчастини','Електрика та монтаж','Інкасація','Пальне','Зв’язок, SIM, CRM','Господарські витрати й прибирання','Доставка','Інше']},
 {g:'Податки і банк',cat:'ФА',items:['Єдиний податок','Військовий збір','Банк і РКО','Банк 1,3% еквайринг','Checkbox','Бухгалтер / юрист']},
 {g:'Капвкладення',cat:'Розвиток',items:['Нова точка / будівництво','Обладнання','Підключення водоканалу']}];
const REC=new Set(['Єдиний податок','Військовий збір','Банк і РКО','Checkbox','Бухгалтер / юрист']);
const CATL={'ТОіР':'обслуговування','ФА':'податки і банк','Розвиток':'капвкладення'};
const artCat=a=>{for(const g of ARTS) if(g.items.includes(a)) return g.cat; return null};
const S={points:{},months:{},pm:{},exp:{},settle:{},meta:{},util:{},pay:{},tariffs:{},inv:{},bal:{},mov:{},radj:{},expreq:{},svc:{},sales:{},meter:{},gwday:{}};
let me=null, userApi=null; const names={};
const loaded=new Set();
let role='owner'; const ACCT_TABS=['util','rent','recon','points','myexp'];
const isDan=()=>window.WL_NAME==='Даниїл'; let danOrdered=false;
let repSub='fin', invSub='dep', expSub='list';
let db=null, canWrite=true, tab='home', cur=null, stale=false, fatal='', expFilter='all', utilPoint='';
const ls={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=n=>nf.format(Math.round(n||0));
const sgn=n=>(n||0)<0?'neg':'';
const mLabel=m=>{const[y,mm]=m.split('-');return MN[+mm-1][0].toUpperCase()+MN[+mm-1].slice(1)+' '+y};
const MNG=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const mGen=m=>MNG[+m.split('-')[1]-1]+' '+m.split('-')[0];
const mShort=m=>MN[+m.split('-')[1]-1].slice(0,3);
const d1=m=>'01.'+m.split('-')[1]+'.'+m.split('-')[0];
const nextMonth=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){mm=1;y++}return y+'-'+String(mm).padStart(2,'0')};
function parseNum(s){
  s=String(s??'').replace(/[\s ]/g,'').replace(/,/g,'.');
  if(s==='')return 0;
  let t=0;for(const p of s.split('+')){if(p==='')return null;const v=Number(p);if(!isFinite(v))return null;t+=v}
  return Math.round(t*10000)/10000;
}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- data access ---------- */
function monthsList(){return Object.keys(S.months).sort()}
function pointsList(){return Object.entries(S.points).map(([id,p])=>({id,...p})).sort((a,b)=>(a.order??99)-(b.order??99)||a.name.localeCompare(b.name))}
const closedBefore=(pid,m)=>{const p=S.points[pid];return !!(p&&p.active===false&&p.closedAt&&p.closedAt.slice(0,7)<m)};
function calc(m){
  const md=S.months[m]||{};
  const rows=[];
  for(const [id,r] of Object.entries(S.pm)) if(r.month===m&&!(closedBefore(r.point,m)&&!(+r.revenue||+r.liters))) rows.push({id,...r});
  const pts=S.points;
  rows.sort((a,b)=>((pts[a.point]?.order??99)-(pts[b.point]?.order??99)));
  const exps=Object.entries(S.exp).filter(([,e])=>e.month===m).map(([id,e])=>({id,...e}));
  const otherBy={};
  for(const e of exps) if(e.point && e.cat!=='Розвиток') otherBy[e.point]=(otherBy[e.point]||0)+(+e.amount||0);
  let L=0,R=0,rent=0,water=0,elec=0,other=0;
  for(const r of rows){
    r.other=otherBy[r.point]||0;
    r.res=(+r.revenue||0)-(+r.rent||0)-(+r.water||0)-(+r.elec||0)-r.other;
    L+=+r.liters||0;R+=+r.revenue||0;rent+=+r.rent||0;water+=+r.water||0;elec+=+r.elec||0;other+=r.other;
  }
  const by=c=>exps.filter(e=>e.cat===c).reduce((s,e)=>s+(+e.amount||0),0);
  const toir=by('ТОіР'), fa=by('ФА'), capex=by('Розвиток');
  const central=toir+fa-other;
  const opex=rent+water+elec+toir+fa;
  const op=R-opex, net=op-capex;
  const vladExp=rent+water+elec+exps.filter(e=>e.payer==='Влад').reduce((s,e)=>s+(+e.amount||0),0);
  const danExp=exps.filter(e=>e.payer==='Даниїл').reduce((s,e)=>s+(+e.amount||0),0);
  const bank=+md.bank||0, cash=+md.cash||0, chk=+md.checkbox||0;
  const vladNet=bank-vladExp, danNet=cash-danExp, total=vladNet+danNet;
  const owed=vladNet-total/2;
  return {md,rows,exps,L,R,rent,water,elec,other,toir,fa,capex,central,opex,op,net,vladExp,danExp,bank,cash,chk,vladNet,danNet,total,owed,price:L?R/L:0};
}
function settleState(){
  const st=S.meta.settings||{};
  const start=st.settleStart||st.start||'2026-10';
  const items=[];
  for(const m of monthsList()) if(m>=start){const c=calc(m);const pend=!(c.bank||c.cash);items.push({kind:'m',key:m,date:m+'-99',amount:pend?0:c.owed,closed:!!S.months[m].closed,pend})}
  for(const [id,p] of Object.entries(S.settle)) if((p.date||'')>=start+'-01') items.push({kind:'p',id,date:p.date,amount:-(p.from==='Даниїл'?-1:1)*(+p.amount||0),p});
  items.sort((a,b)=>a.date.localeCompare(b.date));
  let bal=+st.opening||0;for(const it of items){bal+=it.amount;it.bal=bal}
  return {start,opening:+st.opening||0,items,bal};
}

function payoutStatus(m){
  const st=settleState(), it=st.items.find(i=>i.kind==='m'&&i.key===m);
  if(!it) return `<div class="pst ok">✓ Прибуток за цей місяць виплачено (взаєморозрахунок обнулено, облік з ${mGen(st.start)})</div>`;
  if(it.pend) return `<div class="pst">Виплата ще не рахується: внесіть банк і готівку за місяць</div>`;
  const owed=it.amount; if(Math.abs(owed)<0.5) return `<div class="pst ok">✓ Розрахунок за місяць закритий</div>`;
  let before=st.opening, P=0, last='';
  for(const i of st.items){ if(i.kind==='m'&&i.key<m) before+=i.amount; if(i.kind==='p'){P+=-i.amount; last=i.date>last?i.date:last} }
  const sgn=owed>0?1:-1, need=Math.abs(owed);
  const paidTo=Math.min(need,Math.max(0,sgn*(P-before))); // payments go to the oldest debt first
  const who=owed>0?'Влад → Даниїл':'Даниїл → Влад';
  if(paidTo>=need-0.5) return `<div class="pst ok">✓ Виплачено повністю: ${who} ${f0(need)}${last?` · остання виплата ${fmtD(last)}`:''}</div>`;
  if(paidTo>0.5) return `<div class="pst part">Виплачено частково: ${f0(paidTo)} з ${f0(need)} · залишилось ${f0(need-paidTo)} (${who})</div>`;
  return `<div class="pst no">Ще не виплачено: ${who} ${f0(need)}</div>`;
}

/* ---------- writes ---------- */
async function w(fn){
  if(!db||!canWrite){toast('Немає прав на зміну');return false}
  try{await fn();return true}
  catch(e){
    if(e&&e.code==='invalid_argument'&&!w.warned){canWrite=false;w.warned=1;render();toast('Зміни недоступні з вашим рівнем доступу')}
    else toast(e&&e.code==='quota_exceeded'?'Базу заповнено: '+e.message:'Не збереглося, спробуйте ще раз');
    return false;
  }
}
const isClosed=m=>!!S.months[m]?.closed;
const editable=m=>canWrite&&!isClosed(m);

/* ---------- render ---------- */
function render(){
  const ms=monthsList();
  if(!cur||!S.months[cur]) cur=ms[ms.length-1]||null;
  const sel=$('#monthSel'), ysel=$('#yearSel'), cy=cur?cur.slice(0,4):'';
  const years=[...new Set(ms.map(m=>m.slice(0,4)))].reverse();
  ysel.innerHTML=years.map(y=>`<option value="${y}" ${y===cy?'selected':''}>${y}</option>`).join('')||'<option>—</option>';
  sel.innerHTML=ms.filter(m=>m.startsWith(cy)).reverse().map(m=>`<option value="${m}" ${m===cur?'selected':''}>${cap(MN[+m.slice(5)-1])}${S.months[m].closed?'':' •'}</option>`).join('')||'<option>немає місяців</option>';
  sel.disabled=ysel.disabled=!ms.length;
  const acct=role==='accountant', dan=isDan(), tech=role==='tech';
  if(acct&&!ACCT_TABS.includes(tab)) tab='util';
  if(tech) tab='svc';
  if(dan&&tab==='home') tab='exp';
  if(dan&&repSub==='bal') repSub='fin';
  if(dan&&!danOrdered){const e=document.querySelector('.tab[data-tab=exp]'),r=document.querySelector('.tab[data-tab=reports]');if(e&&r)r.before(e);danOrdered=true}
  $('#newMonthBtn').hidden=acct||tech||!canWrite||!Object.keys(S.points).length;
  document.querySelectorAll('.tab').forEach(t=>{t.hidden=(tech&&t.dataset.tab!=='svc')||(acct&&!ACCT_TABS.includes(t.dataset.tab))||(!acct&&t.dataset.tab==='myexp')||(dan&&t.dataset.tab==='home');t.setAttribute('aria-selected',t.dataset.tab===tab)});
  const main=$('#main');
  if(fatal){main.innerHTML=`<div class="banner warn">${esc(fatal)}</div>`;return}
  if(loaded.size<COLS.length){main.innerHTML=`<section class="card"><h2>Завантаження</h2><p class="note">${stale?'База поки не відповідає. Дані з’являться, щойно з’єднання відновиться.':'Підключаюся до бази: точки, місяці, витрати й взаєморозрахунок з’являться тут.'}</p></section>`;return}
  let h=canWrite?'':'<div class="banner">У вас доступ лише на перегляд.</div>';
  if(tab==='pay') tab='util';
  if(tab==='settle'){tab='exp';expSub='settle'}
  if(tab==='month'||tab==='trend'){repSub=tab==='month'?'fin':tab;tab='reports'}
  const noMonth=`<section class="card"><h2>Місяців поки немає</h2><p class="note">Додайте точки у вкладці «Точки», потім натисніть «+ Місяць».</p></section>`;
  if(tab==='home') h+=cur?viewHome(cur):noMonth;
  if(tab==='reports'){h+=`<div class="seg2 rep" role="tablist">${[['fin','Фінрез по точках'],['trend','Динаміка'],['price','Ціни'],['bal','Баланс']].filter(([k])=>!(isDan()&&k==='bal')).map(([k,l])=>`<button type="button" class="${repSub===k?'on':''}" data-act="setRep" data-id="${k}">${l}</button>`).join('')}</div>`;
    if(repSub==='fin') h+=cur?viewMonth(cur):noMonth; if(repSub==='trend') h+=viewTrend(); if(repSub==='price') h+=viewPrices(); if(repSub==='bal') h+=viewBal();}
  if(tab==='exp'){h+=`<div class="seg2 rep" role="tablist">${[['list','Витрати'],['settle','Взаєморозрахунки']].map(([k,l])=>`<button type="button" class="${expSub===k?'on':''}" data-act="setExpSub" data-id="${k}">${l}</button>`).join('')}</div>`;h+=expSub==='settle'?viewSettle():(cur?viewExp(cur):'');}
  if(tab==='util') h+=cur?viewUtil(cur):'';
  if(tab==='rent') h+=cur?viewRent(cur):'';
  if(tab==='inv'){h+=`<div class="seg2 rep" role="tablist">${[['dep','Внески'],['pct','Відсотки']].map(([k,l])=>`<button type="button" class="${invSub===k?'on':''}" data-act="setInv" data-id="${k}">${l}</button>`).join('')}</div>`;h+=invSub==='pct'?viewInvPct():viewInv();}
  if(tab==='myexp') h+=viewMyExp();
  if(tab==='svc'){h+=`<div class="seg2 rep" role="tablist">${[['reg','Заміни'],['task','Задачі'],['job','Роботи й розрахунок']].map(([k,l])=>`<button type="button" class="${svcSub===k?'on':''}" data-act="setSvcSub" data-id="${k}">${l}${k==='job'&&jobPend().length&&role!=='tech'?` <span class="badge">${jobPend().length}</span>`:''}${k==='task'&&tasksOpen().length?` <span class="badge bl">${tasksOpen().length}</span>`:''}</button>`).join('')}</div>`;h+=svcSub==='job'?viewJobs():svcSub==='task'?viewTasks():viewSvc();}
  if(tab==='recon') h+=viewRecon();
  if(tab==='points') h+=viewPoints();
  main.innerHTML=h;
}

function roundTo(vals){ // round each value so the rounded sum equals the rounded exact sum
  const target=Math.round(vals.reduce((a,v)=>a+v,0)), r=vals.map(v=>Math.round(v));
  let d=target-r.reduce((a,v)=>a+v,0);
  const order=vals.map((v,i)=>[v-Math.round(v),i]).sort((x,y)=>d>0?y[0]-x[0]:x[0]-y[0]);
  for(let k=0;d!==0&&k<order.length;k++){const i=order[k][1];r[i]+=d>0?1:-1;d+=d>0?-1:1}
  return r;
}
function monthTable(c){
  const R=Math.round, cols=['liters','revenue','rent','water','elec','other'];
  const rc={};for(const k of cols) rc[k]=roundTo(c.rows.map(r=>+r[k]||0));
  const rows=c.rows.map((r,i)=>{const o={id:r.id,point:r.point,L:rc.liters[i],rv:rc.revenue[i],rn:rc.rent[i],wa:rc.water[i],el:rc.elec[i],ot:rc.other[i]};o.ex=o.rn+o.wa+o.el+o.ot;o.res=o.rv-o.ex;return o});
  const T={L:0,rv:0,rn:0,wa:0,el:0,ot:0,ex:0,res:0};for(const o of rows)for(const k in T)T[k]+=o[k];
  const capex=R(c.capex), net=R(c.net), op=net+capex, opex=T.rv-op, central=opex-T.ex;
  return {rows,T,central,opex,op,capex,net};
}

function pmInfo(v){
  const [id,k]=v.split('|'), r=S.pm[id]||{}, m=r.month||id.slice(0,7), pid=r.point||id.slice(8), p=S.points[pid]||{}, u=S.util[id]||{};
  const kv=(a,b,c='')=>`<div class="kv ${c}"><span>${a}</span><b>${b}</b></div>`, rv=+r.revenue||0, L=+r.liters||0;
  let h='';
  if(k==='rv'){
    h+=kv('Продано літрів',nf1.format(L)+' л');
    h+=kv('Середня ціна',L?nf2.format(rv/L)+' грн/л':'—');
    h+=kv('Виручка','<b>'+f0(rv)+' грн</b>');
    const prev=monthsList().filter(x=>x<m).pop(), pr=prev?S.pm[prev+'_'+pid]:null;
    if(pr&&+pr.liters)h+=`<div class="note">${mLabel(prev)}: ${nf1.format(+pr.liters)} л по ${nf2.format((+pr.revenue||0)/(+pr.liters))} грн/л · ${f0(+pr.revenue||0)} грн</div>`;
    {const gw=(S.months[m]||{}).gwThru;infoSheet('Виручка · '+(p.name||pid),mLabel(m)+(gw&&gw<monthEnd(m)?' · дані по '+dmy(gw):''),h)}return;
  }
  const exps=Object.values(S.exp).filter(e=>e.month===m&&e.point===pid);
  const wUse=u.w1!=null&&u.w0!=null?u.w1-u.w0:null, eUse=u.e1!=null&&u.e0!=null?u.e1-u.e0:null;
  h+=kv('Оренда',f0(+r.rent||0));
  h+=kv('Вода'+(wUse!=null&&u.wT?`<div class="note">${nf1.format(wUse)} м³ × ${String(u.wT).replace('.',',')} грн</div>`:''),f0(+r.water||0));
  h+=kv('Електро'+(eUse!=null&&u.eT?`<div class="note">${nf1.format(eUse)} кВт·год × ${String(u.eT).replace('.',',')} грн</div>`:''),f0(+r.elec||0));
  for(const e of exps)h+=kv(esc(e.article)+(e.purpose||e.note?`<div class="note">${esc([e.purpose,e.note].filter(Boolean).join(' · '))}</div>`:''),f0(+e.amount||0));
  const tot=(+r.rent||0)+(+r.water||0)+(+r.elec||0)+exps.reduce((a,e)=>a+(+e.amount||0),0);
  h+=kv('Разом','<b>'+f0(tot)+'</b>');
  if(L)h+=`<div class="note">${nf2.format(tot/L)} грн на 1 л · результат ${f0(rv-tot)} грн</div>`;
  infoSheet('Витрати · '+(p.name||pid),mLabel(m),h);
}
function capexInfo(m){
  const L=Object.values(S.exp).filter(e=>e.month===m&&e.cat==='Розвиток').sort((a,b)=>(+b.amount||0)-(+a.amount||0));
  const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
  infoSheet('Капвкладення',mLabel(m),L.map(e=>kv(esc(e.article)+`<div class="note">${esc([e.purpose,e.note,e.point?(S.points[e.point]||{}).name:'',e.payer].filter(Boolean).join(' · '))}</div>`,f0(+e.amount||0))).join('')+kv('Разом','<b>'+f0(L.reduce((a,e)=>a+(+e.amount||0),0))+'</b>'));
}
function centralInfo(m){
  const L=Object.values(S.exp).filter(e=>e.month===m&&!e.point&&e.cat!=='Розвиток').sort((a,b)=>(+b.amount||0)-(+a.amount||0));
  const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
  infoSheet('Загальні витрати мережі',mLabel(m),L.map(e=>kv(esc(e.article)+`<div class="note">${esc([e.purpose,e.note,e.payer].filter(Boolean).join(' · '))}</div>`,f0(+e.amount||0))).join('')+kv('Разом','<b>'+f0(L.reduce((a,e)=>a+(+e.amount||0),0))+'</b>'));
}
function viewMonth(m){
  const c=calc(m), closed=isClosed(m), ed=editable(m), t=monthTable(c);
  const margin=t.T.rv?t.op/t.T.rv*100:0, gw=(S.months[m]||{}).gwThru, gwL=gw&&gw<monthEnd(m)?` <span class="gwd">по ${dmy(gw).slice(0,5)}</span>`:'';
  let h=`<section class="card"><div class="shead"><h2>${mLabel(m)}</h2>
    <span class="pill ${closed?'closed':'open'}">${closed?'закритий':'відкритий'}</span>
    ${canWrite?`<button class="btn sm" data-act="toggleClose" type="button">${closed?'Відкрити для змін':'Закрити місяць'}</button>`:''}</div>
  <div class="tiles">
    ${(()=>{const inn=`<div class="l">Виручка${gwL}</div><div class="v">${f0(t.T.rv)}</div><div class="s">${f0(t.T.L)} л · ${nf2.format(t.T.L?t.T.rv/t.T.L:0)} грн/л</div><div class="s">банк ${c.bank?f0(c.bank):'—'} · готівка ${c.cash?f0(c.cash):'не внесено'}</div>`;return ed?`<button type="button" class="tile tapt" data-act="editMoney" title="Внести банк і готівку">${inn}</button>`:`<div class="tile">${inn}</div>`})()}
    <div class="tile"><div class="l">Операційні витрати</div><div class="v">${f0(t.opex)}</div><div class="s">${nf2.format(t.T.L?t.opex/t.T.L:0)} грн/л</div></div>
    <div class="tile main"><div class="l">Операційний прибуток</div><div class="v ${sgn(t.op)}">${f0(t.op)}</div><div class="s">маржа ${margin.toFixed(1).replace('.',',')}%</div></div>
    <div class="tile"><div class="l">До розподілу</div><div class="v ${sgn(t.net)}">${f0(t.net)}</div><div class="s">по ${f0(t.net/2)} кожному · після капвкладень ${f0(t.capex)}</div></div>
  </div></section>`;

  // points
  const dash='<span class="mut">—</span>', n=v=>v?f0(v):dash;
  h+=`<section class="card"><div class="shead"><h2>Фінрезультат по точках</h2><span class="note">${ed?'натисніть рядок, щоб внести дані':''}</span></div><div class="tbl"><table class="pl">
  <thead><tr><th>Точка</th><th class="num hide-sm">Літри</th><th class="num">Виручка${gwL?`<div class="gwd">${gwL}</div>`:''}</th><th class="num hide-sm">Оренда</th><th class="num hide-sm">Вода</th><th class="num hide-sm">Електро</th><th class="num hide-sm">Інше</th><th class="num">Витрати</th><th class="num">Результат</th></tr></thead><tbody>`;
  for(const o of t.rows){
    const p=S.points[o.point];

function reqCpOpts(pid,val){const all=reqCps(), own=pid?all.filter(o=>o[0].startsWith(pid+'|')).sort((a,b)=>a[0].endsWith('|main')?-1:b[0].endsWith('|main')?1:0):[], other=val==='__other'||(val&&!own.some(o=>o[0]===val));

/* ---------- регламент заміни фільтрів ---------- */
const SVC_T={in:'Вхідні фільтри',post:'Пост-фільтри',mem:'Мембрани',to:'ТО (конліфт, монетник)'};
const MEM_INT=80000, MEM_START='2026-11-09';
const SVC_CHK={coin:'монетник',bill:'купюрник',lift:'конліфт'};
function memStock(){let q=0;const L=[];for(const [id,e] of Object.entries(S.svc)){if(e.type==='memst'){q+=+e.qty||0;L.push({id,...e})}else if(e.type==='mem'&&e.date>MEM_START)q-=1}return {q,L:L.sort((a,b)=>a.date.localeCompare(b.date))}}
const todayISO2=()=>new Date().toISOString().slice(0,10);
function svcEv(pid,t){return Object.entries(S.svc).map(([id,e])=>({id,...e})).filter(e=>e.point===pid&&(!t||e.type===t)).sort((a,b)=>a.date.localeCompare(b.date))}
const mDays=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
function waterDaily(pid,upTo){ // середня вода (л/добу) за 2 останні місяці з показниками
  const ms=monthsList().filter(x=>x<=upTo.slice(0,7)&&S.util[x+'_'+pid]&&+S.util[x+'_'+pid].wUse>0).slice(-2);let U=0,D=0;for(const x of ms){U+=+S.util[x+'_'+pid].wUse*1000;D+=mDays(x)}return D?U/D:null}
function waterBetween(pid,d0,d1){ // літри води з водоміра між датами (пропорційно дням)
  let L=0;const m0=d0.slice(0,7), m1=d1.slice(0,7);
  for(const x of monthsList().filter(x=>x>=m0&&x<=m1)){const u=S.util[x+'_'+pid], D=mDays(x);
    const a=x===m0?+d0.slice(8,10):1, b=x===m1?+d1.slice(8,10):D, days=Math.max(0,b-a+(x===m0?0:1));
    let per=u&&+u.wUse>0?+u.wUse*1000/D:waterDaily(pid,x+'-01');if(per==null)per=0;L+=per*days}
  // місяці, яких ще немає в обліку (поточний)
  if(!monthsList().includes(m1)){const per=waterDaily(pid,d1)||0;L+=per*Math.min(dayDiff(d0,d1),+d1.slice(8,10))}
  return L;
}
const addDay=(d,n)=>new Date(Date.parse(d+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
function soldDay(pid,d){ // продано літрів за день: щоденні продажі Gwaters, інакше місячні літри / днів
  const m=d.slice(0,7), sd=S.sales[m+'_'+pid];
  if(sd&&sd.d){const v=sd.d[d.slice(8,10)];if(v)return +v[0]||0;const last=Object.keys(sd.d).sort().pop();return d.slice(8,10)<=last?0:null}
  const pm=S.pm[m+'_'+pid];if(pm&&+pm.liters>0&&isClosed(m))return +pm.liters/mDays(m);return null}
function soldRate(pid,upTo){let L=0,n=0;for(let i=0;i<40&&n<14;i++){const v=soldDay(pid,addDay(upTo,-i));if(v!=null&&!(i===0&&v<5)){L+=v;n++}}return n>=3?L/n:null}
function soldBetween(pid,d0,d1){ // від дня після d0 до d1 включно; без даних — за середньою
  let L=0,miss=0;const rate=soldRate(pid,d1);for(let d=addDay(d0,1);d<=d1;d=addDay(d,1)){const v=soldDay(pid,d);if(v==null){miss++;L+=rate||0}else L+=v}
  return {L,miss,ok:rate!=null||miss===0};
}
const salesUpd=()=>Object.values(S.sales).map(x=>x.upd||'').sort().pop()||'';
function svcK(pid){ // калібрування: скільки літрів через фільтри на 1 проданий літр (за лічильником автомата)
  const L=svcEv(pid,'in').filter(e=>e.reading!=null&&e.reading>0).slice(-5), ks=[];
  for(let i=1;i<L.length;i++){const dr=L[i].reading-L[i-1].reading, b=soldBetween(pid,L[i-1].date,L[i].date);if(dr>0&&b.L>0&&b.miss<10){const k=dr/b.L;if(k>0.6&&k<4)ks.push(k)}}
  return ks.length?ks.reduce((a,b)=>a+b,0)/ks.length:null;
}
let _svcKnet=null;function svcKnet(){if(_svcKnet!=null)return _svcKnet;const ks=pointsList().map(p=>svcK(p.id)).filter(k=>k!=null).sort((a,b)=>a-b);return _svcKnet=ks.length?ks[Math.floor(ks.length/2)]:1}
function meterOf(pid){const L=Object.values(S.meter).filter(x=>x.point===pid&&+x.w>0).sort((a,b)=>(a.at||a.date).localeCompare(b.at||b.date));return L}
function svcState(pid){
  const today=todayISO2(), last=svcEv(pid,'in').pop()||svcEv(pid,'post').pop(), kp=svcK(pid), k=kp??svcKnet();
  const memL=svcEv(pid,'mem').pop(), toL=svcEv(pid,'to').pop(), r={pid,k,kOwn:kp!=null,last,memL,toL};
  if(last){const prevI=svcEv(pid,'in').map(e=>e.interval).filter(Boolean);r.interval=last.interval||prevI.pop()||20000;
    const b=soldBetween(pid,last.date,today);r.sold=b.L;r.used=k*b.L;r.rate=k*(soldRate(pid,today)||0);r.src='est';
    const ML=meterOf(pid), mt=ML[ML.length-1];
    if(mt&&last.reading!=null&&last.reading>0&&mt.date>=last.date&&+mt.w>=last.reading){ // фактичний лічильник з Gwaters
      const m0=ML.find(x=>dayDiff(x.date,mt.date)>=7);if(m0)r.rate=(mt.w-m0.w)/dayDiff(m0.date,mt.date);
      r.used=mt.w-last.reading+(r.rate||0)*Math.max(0,dayDiff(mt.date,today));r.src='meter';r.meter=mt;r.kAct=r.sold>0?(mt.w-last.reading)/soldBetween(pid,last.date,mt.date).L:null}
    r.left=r.interval-r.used;r.days=r.rate?Math.round(r.left/r.rate):null;r.pct=r.used/r.interval;
    r.st=r.left<=0?'over':(r.days!=null&&r.days<=14)||r.pct>=0.85?'soon':'ok';
    r.due=r.rate&&r.left>0?addDay(today,Math.round(r.left/r.rate)):null}
  if(memL){r.memUsed=k*soldBetween(pid,memL.date,today).L;const ML=meterOf(pid), mt=ML[ML.length-1];
    if(mt&&memL.reading!=null&&memL.reading>0&&mt.date>=memL.date&&+mt.w>=memL.reading){const rt=r.rate||0;r.memUsed=mt.w-memL.reading+rt*Math.max(0,dayDiff(mt.date,today))}
    r.memInt=MEM_INT;r.memPct=r.memUsed/MEM_INT;r.memLeft=MEM_INT-r.memUsed;r.memSt=r.memLeft<=0?'over':r.memPct>=0.85?'soon':'ok';
    r.memDays=r.rate?Math.round(r.memLeft/r.rate):null}
  return r;
}
function svcAll(){_svcKnet=null;return pointsList().filter(p=>p.id!=='p00'&&p.active!==false).map(p=>({p,...svcState(p.id)}))}
function viewSvc(){

  ${canWrite?`<div class="bigacts one" style="margin:0 0 12px"><button class="btn pri main" data-act="addSvc" type="button">+ Заміна / ТО</button></div>`:''}

const gwLast=()=>{const a=Object.values(S.sales).map(x=>x.thru||'').sort().pop()||'';if(a)return a;let b='';for(const g of Object.values(S.gwday||{})){const k=Object.keys(g.d||{}).sort().pop();if(k){const d=g.month+'-'+k;if(d>b)b=d}}return b};
function dayLR(pid,d){const k=d.slice(0,7)+'_'+pid,dd=d.slice(8,10),sd=S.sales[k],g=(S.gwday||{})[k],gv=g&&g.d?g.d[dd]:null;
  if(sd&&sd.d&&sd.d[dd]){const v=sd.d[dd];return [+v[0]||0,(+v[1]||0)+(+v[2]||0),v[4]!=null?+v[4]:(gv?+gv[2]:null)]}
  if(gv)return [+gv[0]||0,+gv[1]||0,+gv[2]||0];return null}
function winLR(pids,d0,d1){ // сума літрів/виручки по днях, де є дані в усіх точках набору
  let L=0,R=0,n=0,N=0,nN=0;for(let d=d0;d<=d1;d=addDay(d,1)){let l=0,r=0,c=0,cOk=true,ok=true;for(const pid of pids){const v=dayLR(pid,d);if(!v){ok=false;break}l+=v[0];r+=v[1];if(v[2]==null)cOk=false;else c+=v[2]}if(ok&&l>0){L+=l;R+=r;n++;if(cOk){N+=c;nN++}}}
  return {L,R,n,lpd:n?L/n:0,pr:L?R/L:0,npd:nN?N/nN:null,lpn:N?L*nN/n/N:null}}
const pHist=p=>(p.priceHist||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
const pf=v=>v==null||v===''?'—':nf2.format(+v).replace(/,00$/,'');
function priceTests(){
  const last=gwLast(); if(!last)return [];
  const act=pointsList().filter(p=>p.id!=='p00'&&p.active!==false&&p.gwId);
  const out=[];
  for(const p of act)for(const h of pHist(p)){
    if(h.d<addDay(last,-730)||h.w0==null)continue;
    const b0=addDay(h.d,-28), b1=addDay(h.d,-1), a0=h.d, a1=last<addDay(h.d,27)?last:addDay(h.d,27);
    const ctrl=act.filter(q=>q.id!==p.id&&q.openedAt&&q.openedAt<=addDay(b0,-14)&&!pHist(q).some(x=>x.d>=b0&&x.d<=a1)).map(q=>q.id);
    const pb=winLR([p.id],b0,b1), pa=winLR([p.id],a0,a1), cb=winLR(ctrl,b0,b1), ca=winLR(ctrl,a0,a1);
    const raw=pb.lpd?pa.lpd/pb.lpd-1:null, cr=cb.lpd&&ca.lpd?ca.lpd/cb.lpd:null, eff=raw!=null&&cr?(pa.lpd/pb.lpd)/cr-1:null;
    const rvEff=pb.lpd&&cr?((pa.lpd*pa.pr)/(pb.lpd*pb.pr))/cr-1:null;
    const nEff=pb.npd&&pa.npd&&cb.npd&&ca.npd?(pa.npd/pb.npd)/(ca.npd/cb.npd)-1:null;
    out.push({p,h,pb,pa,raw,eff,rvEff,nEff,days:pa.n,before:pb.n,nc:ctrl.length});
  }
  return out.sort((a,b)=>b.h.d.localeCompare(a.h.d));
}

  h+=recent.length?`<div class="tbl"><table class="pl ut">${thead}<tbody>${recent.map(trow).join('')}</tbody></table></div>`:`<p class="note">За останні 4 місяці змін ціни не було. Щоб почати тест — відкрийте точку нижче й вкажіть нову ціну та дату зміни.</p>`;

function viewTrend(){
  const all_=monthsList(), Y=(cur||all_[all_.length-1]||'').slice(0,4), ms=all_.filter(m=>m.startsWith(Y)); const cs=ms.map(m=>({m,...calc(m)}));
  if(!ms.length) return `<section class="card"><p class="note">Даних поки немає.</p></section>`;
  const W=640,H=230,pl=44,pb=26,pt=12,pr=8;
  const mx=Math.max(...cs.map(c=>c.R))*1.08||1;
  const step=(W-pl-pr)/cs.length, bw=Math.min(36,step*.55);
  const y=v=>pt+(H-pt-pb)*(1-v/mx);
  const ticks=[0,.25,.5,.75,1].map(t=>Math.round(mx*t/50000)*50000).filter((v,i,a)=>a.indexOf(v)===i&&v<=mx);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Виручка й операційний прибуток по місяцях">`;
  for(const t of ticks) svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t/1000} тис</text>`;
  cs.forEach((c,i)=>{const x=pl+step*i+step/2;
    svg+=`<rect x="${x-bw/2}" y="${y(c.R)}" width="${bw}" height="${y(0)-y(c.R)}" rx="3" fill="var(--cyan)" stroke="var(--line)"/>`;
    svg+=`<rect x="${x-bw/2+5}" y="${y(Math.max(c.op,0))}" width="${bw-10}" height="${y(0)-y(Math.max(c.op,0))}" rx="2" fill="var(--link)"/>`;
    svg+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${mShort(c.m)}</text>`;});
  svg+=`</svg>`;
  let h=`<section class="card"><div class="shead"><h2>Резервна копія</h2><button class="btn sm pri" data-act="exportXlsx" type="button" id="xlsxBtn">Завантажити все в Excel</button></div></section>`;
  h+=`<section class="card chart"><h2>Виручка й операційний прибуток · ${Y}</h2>${svg}<div class="legend"><span><i style="background:var(--cyan);border:1px solid var(--line)"></i>виручка</span><span><i style="background:var(--link)"></i>операційний прибуток</span></div></section>`;
  const tr=(lab,x,cls='')=>`<tr class="${cls}"><td>${lab}</td><td class="num hide-sm">${f0(x.L)}</td><td class="num hide-sm">${x.L?nf2.format(x.R/x.L):'—'}</td><td class="num">${f0(x.R)}</td><td class="num hide-sm">${f0(x.opex)}</td><td class="num ${sgn(x.op)}">${f0(x.op)}</td><td class="num">${x.R?(x.op/x.R*100).toFixed(1).replace('.',',')+'%':'—'}</td><td class="num hide-sm">${x.capex?f0(x.capex):'—'}</td><td class="num ${sgn(x.net)}">${f0(x.net)}</td></tr>`;
  const Z=()=>({L:0,R:0,opex:0,op:0,capex:0,net:0});
  const byY={};for(const c of cs){const t=monthTable(c);const y=c.m.slice(0,4);(byY[y]=byY[y]||[]).push({m:c.m,L:t.T.L,R:t.T.rv,opex:t.opex,op:t.op,capex:t.capex,net:t.net})}
  h+=`<section class="card"><h2>${Y} рік по місяцях</h2><div class="tbl"><table class="pl ut yt"><thead><tr><th>Місяць</th><th class="num hide-sm">Літри</th><th class="num hide-sm">Ціна/л</th><th class="num">Виручка</th><th class="num hide-sm">Опер. витрати</th><th class="num">Опер. прибуток</th><th class="num">%</th><th class="num hide-sm">Капвкл.</th><th class="num">До розпод.</th></tr></thead><tbody>`;
  const ys=Z();
  for(const x of (byY[Y]||[])){h+=tr(cap(MN[+x.m.slice(5)-1]),x);for(const k in ys)ys[k]+=x[k]}
  h+=`</tbody><tfoot>${tr('Разом '+Y,ys,'final')}</tfoot></table></div></section>`;
  // points x months result
  const last=ms;
  h+=`<section class="card"><h2>Результат точок · ${Y}</h2><div class="tbl"><table class="pl"><thead><tr><th>Точка</th>${last.map(m=>`<th class="num">${mShort(m)}</th>`).join('')}</tr></thead><tbody>`;
  const lastCalc=last.map(m=>calc(m));
  for(const p of pointsList()){
    const cells=lastCalc.map(c=>{const r=c.rows.find(r=>r.point===p.id);return r?`<td class="num ${sgn(r.res)}">${f0(r.res)}</td>`:'<td class="num mut">—</td>'});
    if(cells.every(x=>x.includes('mut">—')))continue;
    h+=`<tr><td>${esc(p.name)}</td>${cells.join('')}</tr>`;
  }
  h+=`</tbody><tfoot><tr class="key"><td>Разом по точках</td>${lastCalc.map(c=>{const t=monthTable(c);return `<td class="num">${f0(t.T.res)}</td>`}).join('')}</tr><tr class="tsub"><td>Загальні витрати мережі</td>${lastCalc.map(c=>`<td class="num neg">${f0(-monthTable(c).central)}</td>`).join('')}</tr><tr class="final"><td>Опер. прибуток</td>${lastCalc.map(c=>`<td class="num">${f0(monthTable(c).op)}</td>`).join('')}</tr></tfoot></table></div></section>`;
  return h;
}

const nf1=new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2});
function utilPrev(pid,m){let best=null;for(const u of Object.values(S.util)) if(u.point===pid&&u.month<m&&(!best||u.month>best.month)) best=u;return best}
function utilPts(m){
  const ids=new Set(Object.values(S.pm).filter(r=>r.month===m).map(r=>r.point));
  for(const u of Object.values(S.util)) if(u.month===m) ids.add(u.point);
  return pointsList().filter(p=>ids.has(p.id)&&!(closedBefore(p.id,m)&&!Object.values(S.util).some(u=>u.month===m&&u.point===p.id)));
}
function tariffHist(pid){return Object.entries(S.tariffs).map(([id,t])=>({id,...t})).filter(t=>t.point===pid).sort((a,b)=>a.from.localeCompare(b.from))}
function tariffOf(pid,m){
  const h=tariffHist(pid).filter(t=>t.from<=m); const t=h[h.length-1];
  if(t) return {wT:t.wT??null,eT:t.eT??null,from:t.from};
  const pv=utilPrev(pid,m)||{};return {wT:pv.wT??null,eT:pv.eT??null,from:null};
}
function tariffSince(pid,m){const t=tariffOf(pid,m);return t.from?'з '+mGen(t.from):''}
const perL=(use,liters)=>use!=null&&liters?use*1000/liters:null;
const fmt1=v=>v==null?'—':nf1.format(Math.round(v*10)/10);



/* ---------- перевитрата води/світла на 1 проданий літр ---------- */
const NORM_WARN=0.3, NORM_BAD=0.6;
function utilRatio(m,pid,k){const u=S.util[m+'_'+pid], lit=+(S.pm[m+'_'+pid]||{}).liters||0;if(!u||u.noCharge||!lit)return null;const use=+(k==='w'?u.wUse:u.eUse)||0;return use>0?perL(use,lit):null}
function netRatio(m,k,kind){let U=0,L=0;for(const p of utilPts(m)){if(kind&&(p.kind||'')!==kind)continue;const u=S.util[m+'_'+p.id],lit=+(S.pm[m+'_'+p.id]||{}).liters||0;if(!u||u.noCharge||!lit)continue;const use=+(k==='w'?u.wUse:u.eUse)||0;if(use>0){U+=use;L+=lit}}return L?perL(U,L):null}
const WINTER=[11,12,1,2,3];
const isWinter=m=>WINTER.includes(+m.slice(5,7)), seasonName=m=>isWinter(m)?'зима':'літо';
function seasonMonths(m,incl){const all=monthsList().filter(x=>incl?x<=m:x<m), w=isWinter(m), y0=(+m.slice(0,4)-1)+m.slice(4);return all.filter(x=>x>(incl?y0:y0)&&isWinter(x)===w)}
function seasonNorm(m,kind){let U=0,L=0;for(const x of seasonMonths(m,true))for(const p of utilPts(x)){if(kind&&(p.kind||'')!==kind)continue;const u=S.util[x+'_'+p.id],lit=+(S.pm[x+'_'+p.id]||{}).liters||0;if(!u||u.noCharge||!lit||!(+u.eUse>0))continue;U+=+u.eUse;L+=lit}return L?perL(U,L):null}
function elecNorm(m,pid){
  const r=utilRatio(m,pid,'e'); if(r==null)return null;

async function recalcFrom(pid,from){
  let done=0,closed=0;
  for(const m of monthsList()){ if(m<from)continue; const u=S.util[m+'_'+pid]; if(!u)continue;
    if(isClosed(m)){closed++;continue}
    const t=tariffOf(pid,m), doc={...u};
    if(t.wT!=null&&u.wUse!=null){doc.wT=t.wT;doc.wSum=Math.round(u.wUse*t.wT*100)/100}
    if(t.eT!=null&&u.eUse!=null){doc.eT=t.eT;doc.eSum=Math.round(u.eUse*t.eT*100)/100}
    if(doc.wSum!==u.wSum||doc.eSum!==u.eSum){await saveUtilDoc(m,pid,doc);done++}
  }
  return {done,closed};
}

function fmtD(d){if(!d)return '';const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d);return m?m[3]+'.'+m[2]:d}

  const r=S.pm[m+'_'+pid]||{}, py=S.pay[m+'_'+pid]||{}, u=S.util[m+'_'+pid]||{};

function stPill(paid,due){

function balState(){
  const ms=monthsList().filter(m=>m>=balStart()), op=balOpen()||{bank:0,cash:0}, st={bank:[],cash:[]};
  const inM=(d,m)=>(d||'').slice(0,7)===m;
  let cur_={bank:+op.bank||0,cash:+op.cash||0};
  for(const m of ms){
    const md=S.months[m]||{};
    const ex={bank:0,cash:0};for(const e of Object.values(S.exp))if(e.month===m){if(e.payer==='Даниїл')ex.cash+=+e.amount||0;else ex.bank+=+e.amount||0}
    let rent=0,util=0,rentCashOut=0;
    for(const p of Object.values(S.pay)){
      if(p.rentPaid){const d=p.rentDate||monthEnd(p.month);if(inM(d,m)){rent+=(+p.rentPaid)-(+p.rentCash||0);rentCashOut+=(+p.rentCash||0)}}
      if(p.utilPaid){const d=p.utilDate||monthEnd(p.month);if(inM(d,m))util+=+p.utilPaid}
      if(p.utilPaidW){const d=p.utilDateW||monthEnd(p.month);if(inM(d,m))util+=+p.utilPaidW}}
    const pay={bank:0,cash:0}; /* виплати 50/50 ідуть з особистих коштів, не з рахунку ФОП */
    const mv={bank:{in:0,out:0,list:[]},cash:{in:0,out:0,list:[]}};
    for(const [id,x] of Object.entries(S.mov))if(inM(x.date,m)){const a=+x.amount||0;
      if(mv[x.to]){mv[x.to].in+=a;mv[x.to].list.push({id,...x,sgn:1})} if(mv[x.from]){mv[x.from].out+=a;mv[x.from].list.push({id,...x,sgn:-1})}}
    for(const k of ['bank','cash']){
      const rev=+(k==='bank'?md.bank:md.cash)||0, ru=k==='bank'?rent+util:0;
      const inc=rev+mv[k].in, out=ex[k]+(k==='bank'?rent+util:0)+pay[k]+mv[k].out;
      const open=cur_[k], close=Math.round((open+inc-out)*100)/100, f=(S.bal[m+'_'+k]||{}).fact, fact=f==null||f===''?null:+f;
      st[k].push({m,k,open,rev,mvIn:mv[k].in,mvOut:mv[k].out,mv:mv[k].list,exp:ex[k],rent:k==='bank'?rent:0,rentF2:k==='bank'?rentCashOut:0,util:k==='bank'?util:0,pay:pay[k],inc,out,close,fact,diff:fact==null?null:Math.round((fact-close)*100)/100,note:(S.bal[m+'_'+k]||{}).note||''});
      cur_[k]=fact??close;
    }
  }
  return st;
}

  return h;
}

const nnum=v=>{if(v==null)return 0;if(typeof v==='number')return v;const m=String(v).replace(/\s/g,'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?+m[0]:0};

function parseBank(rows){
  const hi=rows.findIndex(r=>r&&r.some(c=>String(c||'').includes('Дата операції'))&&r.some(c=>String(c||'').trim()==='Сума'));
  if(hi<0)throw new Error('Не схоже на виписку ПриватБанку: немає колонок «Дата операції» і «Сума»');
  const H=rows[hi].map(c=>String(c||'').trim()), ci=n=>H.indexOf(n);
  const cD=ci('Дата операції'),cS=ci('Сума'),cP=ci('Призначення платежу'),cN=ci('Назва контрагента');
  let open=null;for(const r of rows.slice(0,hi))for(const c of r||[]){const m=String(c||'').match(/Вхідний залишок:\s*(-?[\d\s.,]+)/);if(m)open=nnum(m[1])}
  const ops=[];
  for(const r of rows.slice(hi+1)){if(!r||!r[cD])continue;const d=String(r[cD]).match(/(\d\d)\.(\d\d)\.(\d{4})/);if(!d)continue;
    ops.push({date:`${d[3]}-${d[2]}-${d[1]}`,amt:nnum(r[cS]),purp:String(r[cP]||''),name:String(r[cN]||'')})}
  if(!ops.length)throw new Error('У виписці немає операцій');
  return {open,ops};
}
function parseCrm(rows){
  const hi=rows.findIndex(r=>r&&r.includes('Тип оплати')&&r.includes('Торгівельна точка'));
  if(hi<0)throw new Error('Не схоже на вивантаження продажів Gwaters: немає колонок «Тип оплати» і «Торгівельна точка»');
  const H=rows[hi], ci=n=>H.indexOf(n), cD=ci('Дата'),cV=ci('Вартість'),cG=ci('Видано'),cO=ci('Замовлено'),cT=ci('Тип оплати'),cP=ci('Торгівельна точка'),cPr=ci('Ціна');
  const s=[];

const CP_STOP=new Set(['осбб','тов','жк','дп','ф','л','прат','ак','ек','iоц','фоп','ооо','вул','м','київ']);
const cpTok=s=>(s||'').toLowerCase().replace(/[іїi]/g,'i').replace(/[ʼ’'`"«»]/g,'').split(/[^a-zа-яєґ0-9]+/).filter(t=>t&&!CP_STOP.has(t));
function cpPids(bankName){
  const bt=cpTok(bankName); let best=0,ids=[];
  for(const p of pointsList()){const pt=new Set([...cpTok(p.payee),...cpTok(p.payee2),...cpTok(p.name)]);
    const words=bt.filter(t=>t.length>=2&&!/^\d+$/.test(t)&&pt.has(t)).length; if(!words)continue;
    const sc=words*10+bt.filter(t=>/^\d+$/.test(t)&&pt.has(t)).length;
    if(sc>best){best=sc;ids=[p.id]}else if(sc===best)ids.push(p.id)}
  return ids;
}
function payCheck(){
  const ops=CHK.bank.ops, d0=ops.reduce((a,o)=>o.date<a?o.date:a,'9999'), d1=ops.reduce((a,o)=>o.date>a?o.date:a,'');
  const skip=o=>o.amt>=0||/КЛЕЩИНСЬК/i.test(o.name)||/Mastercard|ПОПОВНЕННЯ|ДЕБЕТУВАННЯ|ОБСЛ|ДОХIД|ДОХІД|Розрахунок ПО|валютна/i.test(o.name);
  const groups={}, other=[];
  for(const o of ops){if(skip(o))continue;const pids=cpPids(o.name);if(!pids.length){other.push(o);continue}
    const k=pids.join(',');(groups[k]||(groups[k]={pids,names:new Set(),bank:[],db:[]})).bank.push({date:o.date,amt:-o.amt,purp:o.purp});groups[k].names.add(o.name)}
  {const G=Object.values(groups);let merged=true;
   while(merged){merged=false;for(let i=0;i<G.length&&!merged;i++)for(let j=i+1;j<G.length;j++)if(G[i].pids.some(x=>G[j].pids.includes(x))){
     G[i].pids=[...new Set([...G[i].pids,...G[j].pids])];G[i].bank.push(...G[j].bank);G[j].names.forEach(n=>G[i].names.add(n));G.splice(j,1);merged=true;break}}
   for(const k in groups)delete groups[k];G.forEach((g,i)=>groups['g'+i]=g)}
  for(const [id,p] of Object.entries(S.pay)){
    for(const [a,dt,kind] of [[p.rentPaid!=null?(+p.rentPaid)-(+p.rentCash||0):null,p.rentDate,'оренда'],[p.utilPaid,p.utilDate,'комуналка'],[p.utilPaidW,p.utilDateW,'вода']]){
      if(!a||!dt||dt<d0||dt>d1)continue;
      let g=Object.values(groups).find(g=>g.pids.includes(p.point));
      if(!g){const k=p.point;g=groups[k]||(groups[k]={pids:[p.point],names:new Set(),bank:[],db:[]})}
      g.db.push({date:dt,amt:+a,kind,m:p.month,pid:p.point})}}
  const res=[];
  for(const g of Object.values(groups)){
    const sum=(l,d)=>l.filter(x=>x.date===d).reduce((s,x)=>s+x.amt,0);
    const days=[...new Set([...g.bank,...g.db].map(x=>x.date))].sort();
    let ub=[],ud=[],dd=[];
    for(const d of days){const b=sum(g.bank,d),q=sum(g.db,d);if(Math.abs(b-q)<=0.05)continue;ub.push(...g.bank.filter(x=>x.date===d));ud.push(...g.db.filter(x=>x.date===d))}
    const dif=(a,b)=>Math.abs((new Date(a)-new Date(b))/864e5);
    // одна сума в межах ±7 днів
    for(const x of [...ub]){const j=ud.findIndex(y=>Math.abs(y.amt-x.amt)<0.05&&dif(y.date,x.date)<=7);if(j>=0){ud.splice(j,1);ub.splice(ub.indexOf(x),1)}}
    // одна оплата в обліку = два платежі в банку (напр. світло + вода окремим отримувачам)
    for(const y of [...ud]){let hit=null;
      for(let i=0;i<ub.length&&!hit;i++)for(let k=i+1;k<ub.length;k++)if(Math.abs(ub[i].amt+ub[k].amt-y.amt)<0.05&&dif(ub[i].date,y.date)<=31&&dif(ub[k].date,y.date)<=31){hit=[i,k];break}
      if(hit){const [i,k]=hit;ub.splice(k,1);ub.splice(i,1);ud.splice(ud.indexOf(y),1)}}
    // що лишилось в один день з обох боків — одним рядком
    for(const d of [...new Set(ub.map(x=>x.date))]){const bb=ub.filter(x=>x.date===d),qq=ud.filter(x=>x.date===d);if(!qq.length)continue;
      dd.push({date:d,b:bb.reduce((s,x)=>s+x.amt,0),q:qq.reduce((s,x)=>s+x.amt,0),purp:bb.map(x=>x.purp.slice(0,60)).join('; '),what:qq.map(x=>x.kind+' за '+mLabel(x.m).toLowerCase()).join(', ')});
      ub=ub.filter(x=>x.date!==d);ud=ud.filter(x=>x.date!==d)}
    const tb=g.bank.reduce((s,x)=>s+x.amt,0),td=g.db.reduce((s,x)=>s+x.amt,0);
    res.push({pids:g.pids,names:[...g.names],tb,td,ub,ud,dd});
  }
  res.sort((a,b)=>Math.abs(b.tb-b.td)-Math.abs(a.tb-a.td));
  return {d0,d1,res,other};
}

let reconRows=[], reconCp='', reconFrom='', reconTo='', reconKind='all';
function counterparties(){const m=new Map();for(const p of pointsList()){if(p.id==='p00'||p.active===false)continue;const k=(p.payee||'').trim()||p.name;if(!m.has(k))m.set(k,[]);m.get(k).push(p.id)}return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'uk'))}
let reconPid='';
function reconPts(){return pointsList().filter(p=>p.id!=='p00'&&p.active!==false)}
function reconCps(pid){const p=S.points[pid]||{},o=[];const main=(p.payee||'').trim()||p.name;
  o.push({k:'main',name:main,pids:[pid]});
  const same=reconPts().filter(q=>((q.payee||'').trim()||q.name)===main).map(q=>q.id);
  if(same.length>1)o.push({k:'all',name:main+' — усі локації ('+same.length+')',pids:same});
  if((p.payee2||'').trim())o.push({k:'w',name:p.payee2.trim()+' (вода)',pids:[pid]});
  if((p.payeeF2||'').trim())o.push({k:'f2',name:p.payeeF2.trim(),pids:[pid]});
  return o}
const f2Of=(m,pid,due)=>{const p=S.points[pid]||{},py=S.pay[m+'_'+pid]||{};if(!(p.payeeF2||'').trim())return 0;return Math.min(due,py.rentPaid!=null?(+py.rentCash||0):(+p.rentCash||0))};
const hasW=py=>py&&(py.utilPaidW!=null||py.waterDue!=null);
function setRecon(v){const [k,val]=v.split('|');if(k==='cp')reconCp=val;if(k==='kind')reconKind=val;render()}
function monthEnd(m){const [y,mm]=m.split('-').map(Number);return m+'-'+String(new Date(y,mm,0).getDate()).padStart(2,'0')}
const isDocRef=b=>!!b&&/№|акт|рах/i.test(b);
function reconData(){
  const pts=reconPts(); if(!reconPid||!pts.find(p=>p.id===reconPid)) reconPid=(pts[0]||{}).id||'';
  const cpo=reconCps(reconPid); if(!cpo.find(c=>c.k===reconCp)) reconCp='main';
  const cp=cpo.find(c=>c.k===reconCp), pids=cp.pids, W=reconCp==='w', F2=reconCp==='f2', st=payStart();
  if(!reconFrom) reconFrom=st+'-01'; if(!reconTo) reconTo=todayISO(); if(reconFrom<st+'-01') reconFrom=st+'-01'; {const ad=Object.values(S.radj).map(a=>a.date).filter(Boolean).sort()[0];if(ad&&ad<reconFrom&&reconFrom===st+'-01')reconFrom=ad}
  const R=reconKind!=='util', U=reconKind!=='rent', ev=[];
  for(const m of monthsList()) if(m>=st) for(const pid of pids){ if(!S.pm[m+'_'+pid])continue; const x=payRow(m,pid), me_=monthEnd(m), nm=S.points[pid]?.name||pid;
    if(W){ if(!hasW(x.py))continue; const wd=+x.py.waterDue||0;
      if(U&&wd) ev.push({m,d:x.py.bTo||me_,doc:'Вода за '+mLabel(m).toLowerCase(),pid,acc:wd,paid:0,k:'w'});
      if(U&&x.py.utilPaidW) ev.push({m,d:x.py.utilDateW||me_,doc:'Оплата за воду за '+mLabel(m).toLowerCase(),pid,acc:0,paid:+x.py.utilPaidW,k:'w'});
      continue}
    const f2a=f2Of(m,pid,x.rentDue), f2p=(S.points[pid]?.payeeF2||'').trim()?(+x.py.rentCash||0):0;
    if(F2){ if(R&&f2a) ev.push({m,d:me_,doc:'Оренда за '+mLabel(m).toLowerCase(),pid,acc:f2a,paid:0,k:'r'});
      if(R&&f2p) ev.push({m,d:x.rentDate||me_,doc:'Оплата оренди за '+mLabel(m).toLowerCase(),pid,acc:0,paid:f2p,k:'r'});
      continue}
    const wPart=S.points[pid]?.payee2&&hasW(x.py)?(+x.py.waterDue||0):0;
    if(R&&x.rentDue-f2a) ev.push({m,d:me_,doc:'Оренда за '+mLabel(m).toLowerCase(),pid,acc:x.rentDue-f2a,paid:0,k:'r'});
    if(R&&x.rentPaid-f2p) ev.push({m,d:x.rentDate||me_,doc:'Оплата оренди за '+mLabel(m).toLowerCase(),pid,acc:0,paid:x.rentPaid-f2p,k:'r'});
    if(U&&x.utilDue-wPart) ev.push({m,d:x.py.bTo||me_,doc:'Комуналка за '+mLabel(m).toLowerCase()+(x.py.utilBill!=null?(isDocRef(x.py.basis)?' · '+x.py.basis.trim():'')+(billPeriodTxt(x.py)?' · період '+billPeriodTxt(x.py):''):' (за показниками)'),pid,acc:x.utilDue-wPart,paid:0,k:'u'});
    if(U&&x.utilPaid) ev.push({m,d:x.utilDate||me_,doc:'Оплата комуналки за '+mLabel(m).toLowerCase(),pid,acc:0,paid:x.utilPaid,k:'u'});}
  const cpk=reconCp==='all'?'main':reconCp;
  for(const [id,a] of Object.entries(S.radj))if(pids.includes(a.point)&&(a.cp||'main')===cpk&&(a.kind!=='rent'||R)&&(a.kind!=='util'||U)){const v=+a.amount||0;
    ev.push({m:(a.date||'').slice(0,7),d:a.date,doc:(a.type==='open'?'Початкове сальдо':'Коригування')+(a.kind&&a.kind!=='all'?(a.kind==='rent'?' · оренда':' · комуналка'):'')+(a.note?' · '+a.note:''),pid:a.point,acc:v>0?v:0,paid:v<0?-v:0,k:'a',aid:id})}
  for(const [id,q] of Object.entries(S.expreq)){if(!q.cp||q.status==='no')continue;const [qp,qk]=q.cp.split('|');if(!pids.includes(qp)||qk!==(W?'w':F2?'f2':'main')||!q.date)continue;
    {const bsum=q.billSum!=null?+q.billSum:(q.inv?+q.amount:0); if(bsum) ev.push({m:q.date.slice(0,7),d:q.date,doc:'Рахунок / акт'+(q.billNo?' №'+q.billNo:'')+(q.purpose?' · '+q.purpose:' · '+q.article),pid:qp,acc:bsum,paid:0,k:'q',qid:id});}
    ev.push({m:q.date.slice(0,7),d:q.date,doc:'Оплата · '+q.article+(q.purpose?' · '+q.purpose:''),pid:qp,acc:0,paid:+q.amount||0,k:'q',qid:id})}
  ev.sort((a,b)=>a.d.localeCompare(b.d)||(b.acc-a.acc));
  let open=0; const rows=[];
  for(const e of ev){ if(e.d<reconFrom) open+=e.acc-e.paid; else if(e.d<=reconTo) rows.push(e) }
  return {pts,cpo,cp,pids,open,rows,R,U};
}
